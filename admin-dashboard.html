<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Krushil Web Services</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <h2>KRUSHIL WEB SERVICES</h2>
            <button id="logoutBtn">Logout</button>
        </header>

        <main class="dashboard-content">

            <h1>Admin Dashboard</h1>

            <div class="welcome-box">
                <h2 id="welcomeMessage">Welcome, Admin!</h2>
                <p>You have successfully logged in to the Admin Dashboard.</p>
            </div>

            <div class="admin-info">
                <h3>Admin Account Details</h3>

                <p><strong>Name:</strong> <span id="adminName">Loading...</span></p>

                <p><strong>Email:</strong> <span id="adminEmail">Loading...</span></p>

                <p><strong>Role:</strong> <span id="adminRole">Loading...</span></p>
            </div>

            <div class="dashboard-status">
                <h3>Backend Connection</h3>
                <p id="backendMessage">Checking backend connection...</p>
            </div>

        </main>

    </div>

    <script src="admin.js"></script>

</body>

</html>
