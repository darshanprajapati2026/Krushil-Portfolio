<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management | Krushil Web Services</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>KRUSHIL WEB SERVICES</h1>
                <p>Customer Management</p>
            </div>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </header>

        <main class="dashboard-content">

            <h2>Registered Customers</h2>

            <div class="dashboard-card">
                <h3>Total Customers: <span id="totalCustomers">0</span></h3>

                <input type="text" id="customerSearch" placeholder="Search by name or email...">

                <div class="customer-table-wrapper">
                    <table class="customer-table">
                        <thead>
                            <tr>
                                <th>Sr. No.</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Registration Date</th>
                            </tr>
                        </thead>

                        <tbody id="customerTableBody">
                            <tr>
                                <td colspan="4">Loading customers...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="customerMessage"></p>
            </div>

            <a href="admin-dashboard.html" class="back-link">
                Back to Admin Dashboard
            </a>

        </main>
    </div>

    <script src="customer-management.js"></script>
</body>

</html>
